<div class="flex flex-col w-full items-start justify-evenly mt-5">
  <label for="{{_id}}" class="mb-2">{{ dataSource.label }}</label>
  <div class="dropdown w-full">
    <div tabindex="0" class="select select-accent w-full items-center border-2">
      {{ getSelectedItemsDisplay() || 'Select items' }}
    </div>
    <ul tabindex="0" class="dropdown-content menu p-2 shadow bg-base-100 rounded-box w-full border-2 border-accent max-h-60 overflow-auto">
      <li *ngFor="let listItem of processedItems" class="flex items-center">
        <label class="flex items-center gap-2 w-full cursor-pointer">
          <input type="checkbox" class="checkbox checkbox-accent"
                 [checked]="isItemSelected(listItem.original)"
                 (change)="toggleItemSelection(listItem.original)" />
          <span>{{ listItem.processed }}</span>
        </label>
      </li>
    </ul>
  </div>
  <div *ngIf="(dataSource.formControl.value == null || dataSource.formControl.value.length == 0) ? dataSource.hideErrorsWhenEmpty : true">
    <app-single-error-message
      [errorMessage]="dataSource.errorSetting.errorMessage"
      [specificFormControl]="dataSource.formControl">
    </app-single-error-message>
  </div>
</div>
