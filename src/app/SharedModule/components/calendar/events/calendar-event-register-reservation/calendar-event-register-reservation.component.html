<div (click)="calendarItemClickedEvent?.emit(data)"
     class="flex flex-col justify-start w-full h-full z-10 relative border-2 rounded-md hover:cursor-pointer"
     [ngStyle]="{'background-color': data?.color?.secondaryColor, 'border-color': data?.color?.primaryColor}">

    <div class="flex flex-col overflow-y-hidden h-full">
    <div class="flex justify-between ml-1 mr-1">
      <h1 class="truncate text-black font-semibold">{{ data?.title }}</h1>
      <div class="flex flex-col items-end">
        <p class="text-black truncate font-semibold">{{ startTime }}</p>
        <p class="text-black truncate font-semibold">{{ reservation?.reservationUsers?.length }} / {{ reservation?.maxSize }}</p>
      </div>
    </div>
      <p *ngIf="isEnoughSpace()" class="truncate text-black ml-1">
        {{ data?.description }}
      </p>  </div>

</div>
