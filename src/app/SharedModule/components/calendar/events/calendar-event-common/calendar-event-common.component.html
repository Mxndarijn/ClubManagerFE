<div (click)="calendarItemClickedEvent?.emit(data)" class="flex flex-col justify-start w-full h-full z-10 relative border-2 rounded-md hover:cursor-pointer"
     [ngStyle]="{'background-color': data?.color?.secondaryColor, 'border-color': data?.color?.primaryColor}">
  <div  class="flex justify-between ml-1 mr-1  flex-wrap " >
    <h1 class="truncate text-black font-semibold">{{data?.title}}</h1>
    <p class="text-black truncate font-semibold  ">{{startTime}}</p>
  </div>
  <p class="truncate text-black ml-1 ">{{data?.description}}</p>
</div>
