<div class="flex flex-row justify-between h-14 hover:cursor-pointer"
     [ngClass]="{'bg-base-300': index % 2 == 0, 'bg-base-100': index % 2 == 1}"
     (click)="calendarItemClickedEvent?.emit(calendarEvent)">
  <div class="flex flex-col ml-1">
    <p class="font-semibold text-base truncate text-white">{{ calendarEvent.title }}</p>
    <p class="truncate text-xs text-base-content">{{ calendarEvent.description }}</p>
  </div>
  <p class="truncate text-sm mr-2">{{ time }}</p>
</div>
