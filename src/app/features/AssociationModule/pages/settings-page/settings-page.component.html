<div class="flex flex-col justify-between h-screen-mini mx-10">
  <!--  Profile icon-->
  <section class="flex items-center h-[36vh] flex-row w-full">
    <!--  Profile icon-->
    <div class="indicator mr-5">
      <button
        class="indicator-item indicator-center indicator-bottom mb-5 w-14 h-14 rounded-full badge border-accent border-2 text-accent hover:text-base-content hover:bg-accent"
        (click)="document.getElementById('fileUpload')?.click()">
        <input type="file" id="fileUpload" class="hidden" accept=".png, .jpg, .jpeg"
               (change)="handleChangeAssociationProfilePicture($event)">
        <fa-icon class="fa-2x " [icon]="faPencil"></fa-icon>
      </button>
      <div class="w-80 h-80 bg-base-300 flex items-center rounded-2xl justify-center">
        <!--        TODO Kies welke object-contain,cover,scaledown we willen-->
        <img class="w-10/12 h-10/12 max-w-10/12 max-h-10/12 rounded-2xl border-4 border-accent"
             src="{{associationDetails?.image?.encoded}}"
             alt="Profile picture of the user"/>
      </div>
    </div>
    <!--    Name section-->
    <div class="flex justify-start flex-col gap-y-6 h-full">
      <!--      Association Name+email-->
      <div>
        <h1 class="font-bold text-3xl">{{ associationDetails?.name }}</h1>
        <p>{{ associationDetails?.contactEmail }}</p>
      </div>
      <!--      Association statistics-->
      <div>
        <h3 class="text-xl font-bold">Statistieken</h3>
        <div class="flex flex-row gap-x-8">
          <div class="flex flex-col">
            <p>Aantal Leden:</p>
            <p>Aantal banen:</p>
            <p>Aantal wapens:</p>
          </div>
          <div class="flex flex-col">
            <p>{{ associationStatistics?.totalMembers }}</p>
            <p>{{ associationStatistics?.totalTracks }}</p>
            <p>{{ associationStatistics?.totalWeapons }}</p>
          </div>
        </div>
      </div>
    </div>
  </section>
<!--  Tab row-->
  <section class="flex  h-[10vh] justify-start">
    <app-tab [dataSource]="tabDataSource"></app-tab>
  </section>
  <section class="h-[36vh]">
    <!--    Associtation data -->
    <div class="flex flex-row w-full justify-between h-full" *ngIf="activeTab === Tab.ASSOCIATION_CONTACTDATA">
      <!--      Input fields-->
      <div class="flex flex-col gap-y-6 w-5/12  ">
        <app-default-input-field
          [_formControl]="updateAssociationDataForm.controls.associationName"
          [autocomplete]="'name'"
          [placeholder]="'Pas hier de verenining naam aan'"
          [labelText]="'Vereniging naam'"
          [inputFieldWidth]="InputFieldWidth.FULL"

          [inputId]="'fullName'"
          [type]="'text'"
          [errorSettings]="[{
                  errorMessage: 'Je moet een geldige naam invullen.',
                  errorName: ''
                 }]">
        </app-default-input-field>
        <app-default-input-field
          [_formControl]="updateAssociationDataForm.controls.email"
          [autocomplete]="'name'"
          [placeholder]="'Pas hier de email van de vereninign aan'"
          [labelText]="'Vereniging email'"
          [inputId]="'associationMail'"
          [inputFieldWidth]="InputFieldWidth.FULL"

          [type]="'text'"
          [errorSettings]="[{
                  errorMessage: 'Je moet een geldig email adres invullen.',
                  errorName: ''
                 }]">
        </app-default-input-field>
      </div>
      <div class="w-5/12">
      <app-textarea-modal
        [placeholder]="'Vul hier de beschrijving van de nieuwe competitie in.'"
        [labelText]="'Beschrijving'"
        [textAreaID]="'competitionDescription'"
        [_formControl]="updateAssociationDataForm.controls.associationDescription">
      </app-textarea-modal>

        </div>
      <div class="flex justify-end mt-auto">
        <app-custom-button
          [buttonClass]="ButtonClass.SUCCESS_CLASS"
          [buttonSize]="ButtonSize.BTN_MD"
          [labelText]="'Update'"
          [disabledStatus]="true"
        ></app-custom-button>
      </div>
    </div>
    <!--    Extra information-->
    <div class="flex flex-row justify-between h-full" *ngIf="activeTab === Tab.ASSOCIATION_EXTRAINFORMATION">
      <!--      Input fields-->
      <div class="flex flex-col h-full gap-y-6 w-5/12">
        <div class="flex flex-col gap-x-2">
          <app-rounded-social-box></app-rounded-social-box>
          <app-rounded-social-box></app-rounded-social-box>
          <app-rounded-social-box></app-rounded-social-box>
          <app-rounded-social-box></app-rounded-social-box>
        </div>
      </div>
      <!--  Divider    -->
      <div class="w-2 h-full rounded-2xl bg-accent"></div>
      <!-- Preferences -->
      <div class="flex flex-col h-full w-5/12 justify-start">
        <app-toggle-slider
          id="multipleReservations"
          [sliderLabel]="'Aanmelden meerdere reserveringen'"
          [status]="false">
        </app-toggle-slider>
      </div>
        <div class="flex justify-end mt-auto">
          <app-custom-button
            [buttonClass]="ButtonClass.SUCCESS_CLASS"
            [buttonSize]="ButtonSize.BTN_MD"
            [labelText]="'Update'"
            [disabledStatus]="true"
          ></app-custom-button>
        </div>
      </div>
  </section>
</div>
