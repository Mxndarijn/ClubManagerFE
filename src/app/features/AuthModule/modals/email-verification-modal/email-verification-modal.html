<dialog id="my_modal_16" class="modal modal-bottom sm:modal-middle overflow-y-hidden"
        [ngClass]="{ 'modal-open': showModal}">
  <div class="modal-box">
    <h3 class="font-bold text-lg">Email Verificatie</h3>
    <div class="flex flex-row items-center mt-5">
    <p class="mb-4">We hebben een email gestuurd naar: {{profileEmail}}. Niet gevonden? Kijk ook in je spam</p>
    </div>
    <app-default-input-field
      (valueChanged)="showEmailErrorMessage = false"
      [inputId]="'inputID'"
      [placeholder]="'Vul hier de email in'"
      [_formControl]="resetMailForm.controls.email"
      [labelText]="'Pas het  email adres aan als nodig'"
      [hideErrorsWhenEmpty]="true"
      [inputFieldWidth]="InputFieldWidth.FULL"

      [type]="'text'"
      [errorSettings]="[
      {
      errorMessage: 'Je moet een email invullen.',
      errorName: ''
      }]">
    </app-default-input-field>
    <app-single-error-message
      [errorMessage]="'Deze email bestaat niet'"
      [showErrorMessage]="showEmailErrorMessage"
    >
    </app-single-error-message>

    <div class="modal-action">
      <form method="dialog" class="w-full flex justify-between">
        <app-custom-button
          [buttonClass]="ButtonClass.ERROR_CLASS"
          [buttonSize]="ButtonSize.BTN_MD"
          [labelText]="'Uitloggen'"
          (onClick)="cancelFunction()"
        ></app-custom-button>
        <app-custom-button
          [buttonClass]="ButtonClass.WARNING_CLASS"
          [buttonSize]="ButtonSize.BTN_MD"
          [labelText]="'Wijzig Email'"
          [disabledStatus]="!resetMailForm.valid"
          (onClick)="changeEmail()"
        ></app-custom-button>
      </form>
    </div>
  </div>
</dialog>
