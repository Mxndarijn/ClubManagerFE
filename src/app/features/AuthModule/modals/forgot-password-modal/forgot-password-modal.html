<dialog id="my_modal_16" class="modal modal-bottom sm:modal-middle overflow-y-hidden"
        [ngClass]="{ 'modal-open': showModal}">
  <ng-container [ngSwitch]="step">

    <div class="modal-box">
      <h3 class="font-bold text-lg">Wachtwoord vergeten</h3>
      <div class="flex flex-row items-center mt-5">
      </div>

      <ul class="steps w-full mt-2 mb-3">
        <li *ngFor="let s of steps" class="step" [ngClass]="getClassForStep(s.step)"> {{ s.label | translate }}</li>
      </ul>
      <div *ngSwitchCase="Step.STEP_1">
        <app-default-input-field
          (valueChanged)="showEmailErrorMessage = false"
          [inputId]="'inputID'"
          [placeholder]="'forgotpassword@outlook.com'"
          [_formControl]="formControl"
          [labelText]="'Vul hier de email in'"
          [hideErrorsWhenEmpty]="true"
          [type]="'text'"
          [errorSettings]="[
      {
      errorMessage: 'Je moet een email invullen.',
      errorName: ''
      }]">
        </app-default-input-field>
        <app-single-error-message
        [errorMessage]="'Deze email bestaat niet'"
        [showErrorMessage]="showEmailErrorMessage"
        >
        </app-single-error-message>

        <div class="modal-action">
          <form method="dialog" class="w-full flex justify-between">
            <app-custom-button
              [buttonClass]="ButtonClass.ERROR_CLASS"
              [buttonSize]="ButtonSize.BTN_MD"
              [labelText]="'Annuleer'"
              [disabledStatus]="false"
              (onClick)="cancelFunction()"
            ></app-custom-button>

            <app-custom-button
              [buttonClass]="ButtonClass.SUCCESS_CLASS"
              [buttonSize]="ButtonSize.BTN_MD"
              [labelText]="'Volgende'"
              [disabledStatus]="!formControl.valid"
              (onClick)="acceptFunction()"
            ></app-custom-button>
          </form>
        </div>
      </div>

      <div *ngSwitchCase="Step.STEP_2">
        <app-default-input-field
          (valueChanged)="showEmailErrorMessage = false; formControl.setValue(filterValue())"
          [inputId]="'inputID'"
          [placeholder]="'12345678'"
          [_formControl]="resetPasswordFormGroup.controls.code"
          [labelText]="'Vul hier de code in'"
          [hideErrorsWhenEmpty]="true"
          [type]="'text'"
          [errorSettings]="[
      {
      errorMessage: 'Je moet een geldige acht cijferige code invullen.',
      errorName: ''
      }]">
        </app-default-input-field>
        <app-single-error-message
          [errorMessage]="'Deze code bestaat niet'"
          [showErrorMessage]="showEmailErrorMessage"
        >
        </app-single-error-message>


        <app-default-input-field
          [_formControl]="resetPasswordFormGroup.controls.password"
          [autocomplete]="'new-password'"
          [placeholder]="'registerPage.passwordPlaceholder' | translate"
          [labelText]="'registerPage.passwordHeader' | translate"
          [inputId]="'passwordId'"
          [type]="'password'"
          [errorSettings]="[{
          errorMessage: 'registerPage.errors.noChars' | translate,
          errorName: 'minlength'
         },
         {
          errorMessage: 'registerPage.errors.noUpperCase' | translate,
          errorName: 'noUppercase'
         },
         {
          errorMessage: 'registerPage.errors.noLowerCase' | translate,
          errorName: 'noLowercase'
         }
         ,{
          errorMessage: 'registerPage.errors.noNumber' | translate,
          errorName: 'noNumber'
         }
         ,{
          errorMessage: 'registerPage.errors.noSpecialChar' | translate,
          errorName: 'noSpecialChar'
         }]"
          [visibilityCanBeToggled]="true">

        </app-default-input-field>
        <div>
          <app-default-input-field
            [_formControl]="resetPasswordFormGroup.controls.confirmPassword"
            [autocomplete]="'new-password'"
            [placeholder]="'registerPage.repeatPasswordPlaceholder' | translate"
            [labelText]="'registerPage.repeatPasswordHeader' | translate"
            [inputId]="'repeatNewPassword'"
            [type]="'password'"
            [visibilityCanBeToggled]="true"
            [hideErrorsWhenEmpty]="true">

          </app-default-input-field>
          <app-error-message
            [errorMessage]="'registerPage.errors.passwordMismatch' | translate"
            [formGroup]="resetPasswordFormGroup"
            [specificError]="'passwordsMismatch'">
          </app-error-message>
        </div>

        <div class="modal-action">
          <form method="dialog" class="w-full flex justify-between">
            <app-custom-button
              [buttonClass]="ButtonClass.ERROR_CLASS"
              [buttonSize]="ButtonSize.BTN_MD"
              [labelText]="'Vorige'"
              [disabledStatus]="false"
              (onClick)="cancelFunction()"
            ></app-custom-button>

            <app-custom-button
              [buttonClass]="ButtonClass.SUCCESS_CLASS"
              [buttonSize]="ButtonSize.BTN_MD"
              [labelText]="'Volgende'"
              [disabledStatus]="!formControl.valid"
              (onClick)="acceptFunction()"
            ></app-custom-button>
          </form>
        </div>
      </div>
    </div>
  </ng-container>
</dialog>
