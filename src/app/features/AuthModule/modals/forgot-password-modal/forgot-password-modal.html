<dialog id="my_modal_16" class="modal modal-bottom sm:modal-middle overflow-y-hidden"
        [ngClass]="{ 'modal-open': showModal}">
  <div class="modal-box">
    <h3 class="font-bold text-lg">Wachtwoord vergeten</h3>
    <div class="flex flex-row items-center mt-5">
    </div>
    <app-default-input-field
      [inputId]="'inputID'"
      [placeholder]="'forgotpassword@outlook.com'"
      [_formControl]="formControl"
      [labelText]="'Vul hier de email in'"
      [hideErrorsWhenEmpty]="true"
      [type]="'text'"
      [errorSettings]="[
      {
      errorMessage: 'Je moet een email invullen.',
      errorName: ''
      }]">
    </app-default-input-field>

    <div class="modal-action">
      <form method="dialog" class="w-full flex justify-between" >
        <app-custom-button
          [buttonClass]="ButtonClass.ERROR_CLASS"
          [buttonSize]="ButtonSize.BTN_MD"
          [labelText]="'Annuleer'"
          [disabledStatus]="false"
          (onClick)="cancelFunction()"
        ></app-custom-button>

        <app-custom-button
          [buttonClass]="ButtonClass.SUCCESS_CLASS"
          [buttonSize]="ButtonSize.BTN_MD"
          [labelText]="'Verstuur'"
          [disabledStatus]="false"
          (onClick)="acceptFunction()"
        ></app-custom-button>
      </form>
    </div>
  </div>
</dialog>
