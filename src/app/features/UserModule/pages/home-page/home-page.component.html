<div class="h-screen-mini bg-base-100 flex flex-col justify-around">
  <div class="flex flex-row w-full h-96 max-h-4/6 justify-around">
    <div class="pt-5 flex flex-col items-center  w-7/12 border-2 border-base-200 rounded-xl shadow-3xl"
         *ngFor="let association of associations">
      <div class="flex flex-row justify-around">
        <div class="flex flex-col w-5/12 h-3/4">
          <h1 class="text-5xl font-bold">Welkom naam!</h1>
          <p class="py-6">Fijne dag van vandaag</p>
        </div>
        <div class="flex flex-col w-5/12">
          <img src="{{association.image?.encoded}}" class="h-5/6 rounded-lg shadow-3xl"
               alt="Photo of association {{association.name}}"/>
        </div>
      </div>
    </div>
    <div class="flex flex-col w-4/12 justify-start border-base-200 border-2 bg-base-100 shadow-3xl h-full rounded-xl overflow-y-auto no-scrollbar">
        <div class="flex flex-col">
          <div class="flex flex-row justify-between ml-10 mr-10 mt-4">
            <h1>Mijn aanwezigheid</h1>
            <h1>Maand </h1>
          </div>
          <div class="grid grid-cols-7 gap-x-4 gap-y-2 ml-10 mr-10 pt-4 text-center">
            <!-- Dagen van de week -->
            <p class="font-bold">Ma</p>
            <p class="font-bold">Di</p>
            <p class="font-bold">Wo</p>
            <p class="font-bold">Do</p>
            <p class="font-bold">Vr</p>
            <p class="font-bold">Za</p>
            <p class="font-bold">Zo</p>

            <!-- Grid items voor de dagen -->
            <div *ngFor="let day of days"
              class="flex justify-center items-center w-full h-10 rounded-lg bg-base-300 border-2 border-accent font-bold">
              <p>{{day.day}}</p>
            </div>


          </div>

        </div>
    </div>

  </div>
  <div class="flex flex-row w-full h-80 max-h-3/6 justify-around">
    <div class="pt-5 flex flex-col items-center  w-7/12 border-2 border-base-200 rounded-xl shadow-3xl"
         *ngFor="let association of associations">
      <div class="flex flex-row justify-around">
        <div class="flex flex-col w-5/12">
          <div class="  h-3/4">
            <h1 class="text-5xl font-bold">{{ association.name }}!</h1>
            <p class="py-6">{{ association.welcomeMessage }}</p>
          </div>
          <app-custom-button class=""
                             [buttonClass]="ButtonClass.ACCENT_CLASS"
                             [buttonSize]="ButtonSize.BTN_MD"
                             [labelText]="'Contact'"
                             [disabledStatus]="false"
                             [additionalClasses]="'w-40 text-base mt-4'"
          ></app-custom-button>
        </div>
        <div class="flex flex-col w-5/12">
          <img src="{{association.image?.encoded}}" class="h-3/4 rounded-lg shadow-3xl"
               alt="Photo of association {{association.name}}"/>
          <div class="flex flex-row gap-x-2">
            <app-rounded-social-box></app-rounded-social-box>
            <app-rounded-social-box></app-rounded-social-box>
            <app-rounded-social-box></app-rounded-social-box>
            <app-rounded-social-box></app-rounded-social-box>
          </div>
        </div>
      </div>
      <div class="w-4 h-4 rounded-3xl bg-accent"></div>
    </div>
    <div class="flex flex-col w-4/12 justify-start">
      <app-upcoming-events
        class=" border-base-200 border-2 bg-base-100 shadow-3xl h-full rounded-xl overflow-y-auto no-scrollbar"
        [eventsChangedEvent]="eventsChangedEvent" [currentDay]="currentDay"
        [calendarItemClickedEvent]="CalendarItemClickedEvent"
      ></app-upcoming-events>
    </div>
  </div>
</div>
